# Deploys https://ankyloshop.com whenever code lands on main.
# Merging a pull request into main triggers this workflow (GitHub push event).
name: Deploy to ankyloshop.com

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-ankyloshop-production
  cancel-in-progress: true

permissions:
  id-token: write # required for AWS OIDC
  contents: read

jobs:
  deploy:
    name: Build and deploy static site
    runs-on: ubuntu-latest
    environment: production
    env:
      AWS_REGION: us-east-1
      SITE_URL: https://ankyloshop.com
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build static export
        run: npm run build

      - name: Verify export output
        run: |
          test -f out/index.html
          test -d out/week
          test -d out/session
          echo "Static export OK ($(find out -type f | wc -l) files)"

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Sync to S3 and invalidate CloudFront
        env:
          S3_BUCKET: ${{ secrets.AWS_S3_BUCKET }}
          CLOUDFRONT_DISTRIBUTION_ID: ${{ secrets.AWS_CLOUDFRONT_DISTRIBUTION_ID }}
        run: |
          if [[ -z "$S3_BUCKET" || -z "$CLOUDFRONT_DISTRIBUTION_ID" ]]; then
            echo "::error::Missing AWS_S3_BUCKET or AWS_CLOUDFRONT_DISTRIBUTION_ID. See docs/DEPLOYMENT.md (Step 7)."
            exit 1
          fi
          aws s3 sync out/ "s3://${S3_BUCKET}/" --delete
          aws cloudfront create-invalidation \
            --distribution-id "$CLOUDFRONT_DISTRIBUTION_ID" \
            --paths "/*"
          echo "Deployed to ${SITE_URL}"
